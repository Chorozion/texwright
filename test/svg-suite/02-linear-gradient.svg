<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="0.6" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#fdf6e3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#1dd1a1"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="200" rx="10" fill="url(#sky)"/>
  <rect x="210" y="40" width="180" height="40" fill="url(#bar)"/>
  <rect x="210" y="100" width="120" height="40" fill="url(#bar)"/>
  <circle cx="300" cy="180" r="30" fill="url(#bar)"/>
</svg>