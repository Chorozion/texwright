<path d="M445,96 C445,150 85,150 85,98" fill="none" stroke="#1f3a4d" stroke-width="1.4" marker-end="url(#a)"/>
<text x="265" y="146" text-anchor="middle" fill="#5d6973" font-size="12">no: update contents and \pageref numbers, typeset again (at most 4 passes)</text>
