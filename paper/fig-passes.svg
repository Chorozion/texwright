<rect x="550" y="40" width="150" height="56" rx="6" fill="#eef7f1" stroke="#2f6b4f" stroke-width="1.3"/><text x="625" y="64" text-anchor="middle" fill="#1b2127" font-weight="bold">Ship</text><text x="625" y="81" text-anchor="middle" fill="#5d6973" font-size="11">write the PDF once</text>
