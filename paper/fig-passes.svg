<rect x="10" y="40" width="150" height="56" rx="6" fill="#eef2f6" stroke="#1f3a4d" stroke-width="1.3"/><text x="85" y="64" text-anchor="middle" fill="#1b2127" font-weight="bold">Typeset</text><text x="85" y="81" text-anchor="middle" fill="#5d6973" font-size="11">page map from last pass</text>
