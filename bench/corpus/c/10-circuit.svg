<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="600" height="340" fill="#ffffff"/>
  <g stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left side: power supply (two-cell battery symbol), + on top -->
    <line x1="90" y1="70" x2="90" y2="150"/>
    <line x1="66" y1="150" x2="114" y2="150"/>
    <line x1="78" y1="162" x2="102" y2="162"/>
    <line x1="66" y1="174" x2="114" y2="174"/>
    <line x1="78" y1="186" x2="102" y2="186"/>
    <line x1="90" y1="186" x2="90" y2="280"/>
    <!-- top wire with switch -->
    <line x1="90" y1="70" x2="140" y2="70"/>
    <line x1="140" y1="70" x2="184" y2="48"/>
    <line x1="190" y1="70" x2="252" y2="70"/>
    <!-- ammeter -->
    <circle cx="272" cy="70" r="20"/>
    <line x1="292" y1="70" x2="400" y2="70"/>
    <!-- right side: resistor -->
    <line x1="400" y1="70" x2="400" y2="125"/>
    <polyline points="400,125 412,133 388,149 412,165 388,181 412,197 388,213 400,221"/>
    <line x1="400" y1="221" x2="400" y2="280"/>
    <!-- bottom wire -->
    <line x1="400" y1="280" x2="90" y2="280"/>
    <!-- voltmeter branch -->
    <line x1="400" y1="100" x2="490" y2="100"/>
    <line x1="490" y1="100" x2="490" y2="153"/>
    <circle cx="490" cy="173" r="20"/>
    <line x1="490" y1="193" x2="490" y2="250"/>
    <line x1="490" y1="250" x2="400" y2="250"/>
  </g>
  <!-- switch contacts and junction dots -->
  <g fill="#111111">
    <circle cx="140" cy="70" r="4"/>
    <circle cx="190" cy="70" r="4"/>
    <circle cx="400" cy="100" r="4.5"/>
    <circle cx="400" cy="250" r="4.5"/>
  </g>
  <!-- meter letters -->
  <g fill="#111111" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="272" y="77">A</text>
    <text x="490" y="180">V</text>
  </g>
  <!-- labels -->
  <g fill="#111111">
    <text x="58" y="146" text-anchor="end">+</text>
    <text x="58" y="194" text-anchor="end">&#8722;</text>
    <text x="8" y="225" font-size="13">DC supply</text>
    <text x="8" y="242" font-size="13">0 to 12 V</text>
    <text x="165" y="38" text-anchor="middle">S</text>
    <text x="272" y="112" text-anchor="middle">ammeter</text>
    <text x="368" y="178" text-anchor="end">R</text>
    <text x="516" y="178">voltmeter</text>
  </g>
  <!-- conventional current arrow -->
  <g stroke="#b03a2e" stroke-width="1.8" fill="none">
    <line x1="318" y1="56" x2="366" y2="56"/>
    <polyline points="358,51 366,56 358,61"/>
  </g>
  <text x="342" y="46" fill="#b03a2e" font-size="14" text-anchor="middle" font-style="italic">I</text>
</svg>
