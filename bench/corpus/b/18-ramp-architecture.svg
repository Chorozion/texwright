<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- left panel title -->
  <text x="160" y="30" text-anchor="middle" font-weight="bold" font-size="13">Molecular graph with ring nodes</text>

  <!-- ring-to-atom links (dashed) -->
  <g stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4,3">
    <line x1="130" y1="150" x2="173.3" y2="125"/>
    <line x1="130" y1="150" x2="130" y2="100"/>
    <line x1="130" y1="150" x2="86.7" y2="125"/>
    <line x1="130" y1="150" x2="86.7" y2="175"/>
    <line x1="130" y1="150" x2="130" y2="200"/>
    <line x1="130" y1="150" x2="173.3" y2="175"/>
    <line x1="216.6" y1="150" x2="259.9" y2="125"/>
    <line x1="216.6" y1="150" x2="216.6" y2="100"/>
    <line x1="216.6" y1="150" x2="173.3" y2="125"/>
    <line x1="216.6" y1="150" x2="173.3" y2="175"/>
    <line x1="216.6" y1="150" x2="216.6" y2="200"/>
    <line x1="216.6" y1="150" x2="259.9" y2="175"/>
  </g>

  <!-- bonds (solid) -->
  <g stroke="#2b2b2b" stroke-width="2.2">
    <line x1="173.3" y1="125" x2="130" y2="100"/>
    <line x1="130" y1="100" x2="86.7" y2="125"/>
    <line x1="86.7" y1="125" x2="86.7" y2="175"/>
    <line x1="86.7" y1="175" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="173.3" y2="175"/>
    <line x1="173.3" y1="175" x2="173.3" y2="125"/>
    <line x1="173.3" y1="125" x2="216.6" y2="100"/>
    <line x1="216.6" y1="100" x2="259.9" y2="125"/>
    <line x1="259.9" y1="125" x2="259.9" y2="175"/>
    <line x1="259.9" y1="175" x2="216.6" y2="200"/>
    <line x1="216.6" y1="200" x2="173.3" y2="175"/>
    <line x1="86.7" y1="125" x2="48" y2="103"/>
  </g>

  <!-- atoms -->
  <g fill="#ffffff" stroke="#1f4e9c" stroke-width="2">
    <circle cx="173.3" cy="125" r="8"/>
    <circle cx="130" cy="100" r="8"/>
    <circle cx="86.7" cy="125" r="8"/>
    <circle cx="86.7" cy="175" r="8"/>
    <circle cx="130" cy="200" r="8"/>
    <circle cx="173.3" cy="175" r="8"/>
    <circle cx="216.6" cy="100" r="8"/>
    <circle cx="259.9" cy="125" r="8"/>
    <circle cx="259.9" cy="175" r="8"/>
    <circle cx="216.6" cy="200" r="8"/>
  </g>
  <circle cx="48" cy="103" r="9" fill="#ffffff" stroke="#b03a2e" stroke-width="2"/>
  <text x="48" y="107" text-anchor="middle" font-size="10" fill="#b03a2e">O</text>
  <!-- fused atoms highlighted -->
  <circle cx="173.3" cy="125" r="8" fill="#dbe7f7" stroke="#1f4e9c" stroke-width="2"/>
  <circle cx="173.3" cy="175" r="8" fill="#dbe7f7" stroke="#1f4e9c" stroke-width="2"/>

  <!-- ring nodes -->
  <rect x="121" y="141" width="18" height="18" fill="#f6c28b" stroke="#d9822b" stroke-width="2"/>
  <rect x="207.6" y="141" width="18" height="18" fill="#f6c28b" stroke="#d9822b" stroke-width="2"/>
  <text x="130" y="236" text-anchor="middle" fill="#8a4f12">r₁ (6-ring)</text>
  <text x="216.6" y="236" text-anchor="middle" fill="#8a4f12">r₂ (6-ring)</text>

  <!-- legend -->
  <g font-size="11" fill="#333333">
    <circle cx="40" cy="262" r="6" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <text x="52" y="266">atom node hᵥ</text>
    <rect x="134" y="256" width="12" height="12" fill="#f6c28b" stroke="#d9822b" stroke-width="1.5"/>
    <text x="152" y="266">ring node r_C</text>
    <line x1="34" y1="284" x2="58" y2="284" stroke="#2b2b2b" stroke-width="2.2"/>
    <text x="64" y="288">bond message</text>
    <line x1="140" y1="284" x2="164" y2="284" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="170" y="288">atom–ring message</text>
  </g>

  <!-- divider -->
  <line x1="320" y1="20" x2="320" y2="285" stroke="#dddddd" stroke-width="1"/>

  <!-- right panel: one layer, then readout -->
  <text x="480" y="30" text-anchor="middle" font-weight="bold" font-size="13">RAMP layer t → t+1</text>
  <rect x="356" y="40" width="248" height="152" rx="6" fill="#f7f7f7" stroke="#999999" stroke-dasharray="5,3"/>
  <text x="590" y="60" text-anchor="end" font-size="11" fill="#666666">repeat T times</text>

  <rect x="368" y="68" width="224" height="30" rx="5" fill="#e3eefa" stroke="#1f4e9c"/>
  <text x="480" y="88" text-anchor="middle" font-size="11">1. bond messages mᵥ (Eq. 1)</text>
  <line x1="480" y1="98" x2="480" y2="112" stroke="#444444" stroke-width="1.3" marker-end="url(#a)"/>

  <rect x="368" y="114" width="224" height="30" rx="5" fill="#fdecd8" stroke="#d9822b"/>
  <text x="480" y="134" text-anchor="middle" font-size="11">2. atoms → ring: update r_C (Eq. 2)</text>
  <line x1="480" y1="144" x2="480" y2="158" stroke="#444444" stroke-width="1.3" marker-end="url(#a)"/>

  <rect x="368" y="160" width="224" height="30" rx="5" fill="#fdecd8" stroke="#d9822b"/>
  <text x="480" y="180" text-anchor="middle" font-size="11">3. ring → atoms: update hᵥ (Eq. 3)</text>

  <line x1="480" y1="196" x2="480" y2="214" stroke="#444444" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="368" y="216" width="224" height="30" rx="5" fill="#eeeeee" stroke="#666666"/>
  <text x="480" y="236" text-anchor="middle" font-size="11">readout: Σ hᵥ + Σ r_C</text>
  <line x1="480" y1="246" x2="480" y2="260" stroke="#444444" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="420" y="262" width="120" height="26" rx="5" fill="#eeeeee" stroke="#666666"/>
  <text x="480" y="280" text-anchor="middle">MLP → ŷ</text>
</svg>
