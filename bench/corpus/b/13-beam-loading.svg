<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="0">
      <path d="M0,0 L10,0 L5,10 z" fill="#1f4e9c"/>
    </marker>
    <marker id="dnr" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="8" markerHeight="8" orient="0">
      <path d="M0,0 L10,0 L5,10 z" fill="#b03a2e"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2,9 L8,1" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- distributed load block -->
  <rect x="80" y="104" width="480" height="22" fill="#e3ecf8" stroke="#1f4e9c" stroke-width="1.2"/>
  <text x="92" y="120" fill="#1f4e9c">gₖ = 4.00 kN/m (permanent)</text>
  <text x="548" y="120" text-anchor="end" fill="#1f4e9c">qₖ = 6.00 kN/m (imposed)</text>
  <g stroke="#1f4e9c" stroke-width="1.3" marker-end="url(#dn)">
    <line x1="80"  y1="126" x2="80"  y2="166"/>
    <line x1="120" y1="126" x2="120" y2="166"/>
    <line x1="160" y1="126" x2="160" y2="166"/>
    <line x1="200" y1="126" x2="200" y2="166"/>
    <line x1="240" y1="126" x2="240" y2="166"/>
    <line x1="280" y1="126" x2="280" y2="166"/>
    <line x1="360" y1="126" x2="360" y2="166"/>
    <line x1="400" y1="126" x2="400" y2="166"/>
    <line x1="440" y1="126" x2="440" y2="166"/>
    <line x1="480" y1="126" x2="480" y2="166"/>
    <line x1="520" y1="126" x2="520" y2="166"/>
    <line x1="560" y1="126" x2="560" y2="166"/>
  </g>

  <!-- point load -->
  <line x1="320" y1="40" x2="320" y2="164" stroke="#b03a2e" stroke-width="2.6" marker-end="url(#dnr)"/>
  <text x="330" y="52" fill="#b03a2e" font-weight="bold">Qₖ = 10.0 kN</text>

  <!-- beam -->
  <rect x="70" y="170" width="500" height="12" fill="#6b6b6b" stroke="#333333"/>
  <text x="588" y="181" fill="#333333" font-size="12">IPE 300</text>

  <!-- left support: pin -->
  <polygon points="80,182 66,208 94,208" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="58" y1="208" x2="102" y2="208" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1">
    <line x1="62" y1="208" x2="56" y2="216"/>
    <line x1="72" y1="208" x2="66" y2="216"/>
    <line x1="82" y1="208" x2="76" y2="216"/>
    <line x1="92" y1="208" x2="86" y2="216"/>
    <line x1="102" y1="208" x2="96" y2="216"/>
  </g>
  <text x="80" y="234" text-anchor="middle" font-weight="bold">A</text>

  <!-- right support: roller -->
  <polygon points="560,182 546,204 574,204" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="551" cy="208" r="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <circle cx="569" cy="208" r="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <line x1="538" y1="212" x2="582" y2="212" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1">
    <line x1="542" y1="212" x2="536" y2="220"/>
    <line x1="552" y1="212" x2="546" y2="220"/>
    <line x1="562" y1="212" x2="556" y2="220"/>
    <line x1="572" y1="212" x2="566" y2="220"/>
    <line x1="582" y1="212" x2="576" y2="220"/>
  </g>
  <text x="560" y="234" text-anchor="middle" font-weight="bold">B</text>

  <!-- dimension lines -->
  <g stroke="#333333" stroke-width="1">
    <line x1="80" y1="252" x2="560" y2="252" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="80" y1="244" x2="80" y2="290"/>
    <line x1="560" y1="244" x2="560" y2="290"/>
    <line x1="320" y1="244" x2="320" y2="260"/>
    <line x1="80" y1="282" x2="560" y2="282" marker-start="url(#tick)" marker-end="url(#tick)"/>
  </g>
  <text x="200" y="247" text-anchor="middle" font-size="12">3.0 m</text>
  <text x="440" y="247" text-anchor="middle" font-size="12">3.0 m</text>
  <text x="320" y="277" text-anchor="middle">L = 6.0 m</text>
</svg>
