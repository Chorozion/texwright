<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- clients -->
  <rect x="290" y="16" width="180" height="40" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="380" y="41" text-anchor="middle">Web and mobile clients</text>
  <line x1="380" y1="56" x2="380" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- load balancer -->
  <rect x="300" y="86" width="160" height="34" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="380" y="108" text-anchor="middle">Load balancer</text>
  <line x1="380" y1="120" x2="380" y2="146" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- monolith -->
  <rect x="70" y="148" width="620" height="160" rx="8" fill="#fdf0e1" stroke="#c77c2a" stroke-width="2"/>
  <text x="90" y="172" font-weight="bold" fill="#8a4f12">core-app (Rails 7.1 monolith, single deployable)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="90"  y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="134" y="211">Catalog</text>
    <rect x="188" y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="232" y="211">Search</text>
    <rect x="286" y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="330" y="211">Cart</text>
    <rect x="384" y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="428" y="211">Pricing</text>
    <rect x="482" y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="526" y="211">Checkout</text>
    <rect x="580" y="186" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="624" y="211">Payments</text>
    <rect x="90"  y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="134" y="265">Inventory</text>
    <rect x="188" y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="232" y="265">Fulfillment</text>
    <rect x="286" y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="330" y="265">Accounts</text>
    <rect x="384" y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="428" y="265">Admin</text>
    <rect x="482" y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="526" y="265">Reporting</text>
    <rect x="580" y="240" width="88" height="40" rx="4" fill="#ffffff" stroke="#c77c2a"/><text x="624" y="265">CMS</text>
  </g>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#8a4f12">modules call each other in-process and share every table</text>

  <!-- arrows to backing stores -->
  <line x1="200" y1="308" x2="170" y2="346" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="308" x2="380" y2="346" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="308" x2="590" y2="346" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Redis -->
  <rect x="90" y="348" width="150" height="56" rx="6" fill="#eef3f8" stroke="#5b7290"/>
  <text x="165" y="372" text-anchor="middle">Redis</text>
  <text x="165" y="390" text-anchor="middle" font-size="11" fill="#555555">cache, sessions, job queue</text>

  <!-- PostgreSQL cylinder -->
  <path d="M290,358 v44 a90,10 0 0 0 180,0 v-44" fill="#e9eef3" stroke="#5b7290" stroke-width="1.5"/>
  <ellipse cx="380" cy="358" rx="90" ry="10" fill="#f5f8fb" stroke="#5b7290" stroke-width="1.5"/>
  <text x="380" y="388" text-anchor="middle" font-weight="bold">PostgreSQL 15</text>
  <text x="380" y="405" text-anchor="middle" font-size="11" fill="#555555">one schema, 380 tables, 2.1 TB</text>
  <text x="380" y="432" text-anchor="middle" font-size="11" fill="#555555">primary + 2 read replicas</text>

  <!-- Sidekiq -->
  <rect x="520" y="348" width="150" height="56" rx="6" fill="#fdf0e1" stroke="#c77c2a"/>
  <text x="595" y="372" text-anchor="middle">Sidekiq workers</text>
  <text x="595" y="390" text-anchor="middle" font-size="11" fill="#555555">same codebase as core-app</text>
</svg>
