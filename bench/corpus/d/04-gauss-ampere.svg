<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" font-family="Times New Roman, Times, serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b22222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="360" fill="#ffffff"/>

  <!-- ===================== Panel (a): Gauss ===================== -->
  <!-- radial field lines -->
  <g stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)">
    <line x1="216.0" y1="160.0" x2="300.0" y2="160.0"/>
    <line x1="199.6" y1="120.4" x2="259.0" y2="61.0"/>
    <line x1="160.0" y1="104.0" x2="160.0" y2="20.0"/>
    <line x1="120.4" y1="120.4" x2="61.0" y2="61.0"/>
    <line x1="104.0" y1="160.0" x2="20.0" y2="160.0"/>
    <line x1="120.4" y1="199.6" x2="61.0" y2="259.0"/>
    <line x1="160.0" y1="216.0" x2="160.0" y2="300.0"/>
    <line x1="199.6" y1="199.6" x2="259.0" y2="259.0"/>
  </g>
  <!-- charged sphere -->
  <circle cx="160" cy="160" r="50" fill="#fde3c4" stroke="#c8741a" stroke-width="1.5"/>
  <g fill="#c8741a" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="146">+</text>
    <text x="178" y="144">+</text>
    <text x="132" y="178">+</text>
    <text x="186" y="182">+</text>
    <text x="160" y="196">+</text>
  </g>
  <!-- radius R -->
  <line x1="160" y1="160" x2="195.4" y2="124.6" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="160" cy="160" r="2" fill="#1a1a1a"/>
  <text x="168" y="166" font-style="italic">Q</text>
  <text x="182" y="150" font-style="italic" font-size="14">R</text>
  <!-- Gaussian surface -->
  <circle cx="160" cy="160" r="100" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="7 5"/>
  <!-- area element and outward normal -->
  <path d="M 246.6 110.0 A 100 100 0 0 1 256.6 134.1" fill="none" stroke="#b22222" stroke-width="4"/>
  <line x1="252.4" y1="121.7" x2="283.8" y2="108.7" stroke="#b22222" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="288" y="108" fill="#b22222" font-style="italic">d<tspan font-weight="bold" font-style="normal">a</tspan></text>
  <text x="66" y="82" font-style="italic">S</text>
  <text x="300" y="152" fill="#1f5fa8" font-weight="bold">E</text>
  <text x="165" y="345" text-anchor="middle" font-size="15">(a) Gaussian sphere S of radius r &gt; R</text>

  <!-- ===================== Panel (b): Ampere ===================== -->
  <!-- back half of the loop (drawn first, behind the wire) -->
  <path d="M 390 170 A 100 32 0 0 1 590 170" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="7 5"/>
  <!-- wire -->
  <line x1="490" y1="300" x2="490" y2="22" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="44" font-style="italic">I</text>
  <!-- front half of the loop -->
  <path d="M 590 170 A 100 32 0 0 1 390 170" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="7 5"/>
  <!-- radius s -->
  <line x1="490" y1="170" x2="590" y2="170" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="536" y="164" font-style="italic" font-size="15">s</text>
  <!-- B direction (counter-clockwise seen from above) -->
  <g stroke="#1f5fa8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)">
    <line x1="470" y1="202" x2="512" y2="202"/>
    <line x1="590" y1="184" x2="590" y2="156"/>
    <line x1="390" y1="156" x2="390" y2="184"/>
  </g>
  <text x="600" y="160" fill="#1f5fa8" font-weight="bold">B</text>
  <text x="430" y="226" font-style="italic">C</text>
  <text x="490" y="345" text-anchor="middle" font-size="15">(b) Amperian loop C of radius s</text>
</svg>
