<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b2182b"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555555" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="470" fill="#ffffff"/>

  <!-- ================= Loading diagram ================= -->
  <text x="20" y="22" font-weight="bold" fill="#111111">(a) Loading (ULS)</text>
  <!-- UDL -->
  <line x1="80" y1="55" x2="560" y2="55" stroke="#b2182b" stroke-width="1.5"/>
  <g stroke="#b2182b" stroke-width="1.3" marker-end="url(#ahRed)">
    <line x1="80" y1="55" x2="80" y2="93"/>
    <line x1="120" y1="55" x2="120" y2="93"/>
    <line x1="160" y1="55" x2="160" y2="93"/>
    <line x1="200" y1="55" x2="200" y2="93"/>
    <line x1="240" y1="55" x2="240" y2="93"/>
    <line x1="280" y1="55" x2="280" y2="93"/>
    <line x1="320" y1="55" x2="320" y2="93"/>
    <line x1="360" y1="55" x2="360" y2="93"/>
    <line x1="400" y1="55" x2="400" y2="93"/>
    <line x1="440" y1="55" x2="440" y2="93"/>
    <line x1="480" y1="55" x2="480" y2="93"/>
    <line x1="520" y1="55" x2="520" y2="93"/>
    <line x1="560" y1="55" x2="560" y2="93"/>
  </g>
  <text x="320" y="45" text-anchor="middle" fill="#b2182b">w<tspan font-size="9" dy="3">Ed</tspan><tspan dy="-3"> = 1.35 g</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> + 1.5 q</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> = 35.9 kN/m</tspan></text>
  <!-- beam -->
  <rect x="80" y="95" width="480" height="10" fill="#9ecae1" stroke="#08519c" stroke-width="1.2"/>
  <!-- pin support at A -->
  <polygon points="80,105 66,127 94,127" fill="#ffffff" stroke="#222222" stroke-width="1.3"/>
  <rect x="60" y="127" width="40" height="7" fill="url(#hatch)" stroke="none"/>
  <line x1="60" y1="127" x2="100" y2="127" stroke="#222222" stroke-width="1.3"/>
  <!-- roller support at B -->
  <polygon points="560,105 546,123 574,123" fill="#ffffff" stroke="#222222" stroke-width="1.3"/>
  <circle cx="552" cy="126" r="2.6" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <circle cx="568" cy="126" r="2.6" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <rect x="540" y="129" width="40" height="7" fill="url(#hatch)" stroke="none"/>
  <line x1="540" y1="129" x2="580" y2="129" stroke="#222222" stroke-width="1.3"/>
  <text x="50" y="104" text-anchor="end" font-weight="bold">A</text>
  <text x="592" y="104" font-weight="bold">B</text>
  <!-- span dimension -->
  <line x1="80" y1="155" x2="560" y2="155" stroke="#222222" stroke-width="1" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="80" y1="140" x2="80" y2="162" stroke="#222222" stroke-width="0.8"/>
  <line x1="560" y1="140" x2="560" y2="162" stroke="#222222" stroke-width="0.8"/>
  <rect x="290" y="146" width="60" height="16" fill="#ffffff"/>
  <text x="320" y="159" text-anchor="middle">L = 6.00 m</text>
  <text x="80" y="178" text-anchor="middle" font-size="11">R<tspan font-size="8" dy="3">A</tspan><tspan dy="-3"> = 107.8 kN</tspan></text>
  <text x="560" y="178" text-anchor="middle" font-size="11">R<tspan font-size="8" dy="3">B</tspan><tspan dy="-3"> = 107.8 kN</tspan></text>

  <!-- ================= Shear force diagram ================= -->
  <text x="20" y="200" font-weight="bold" fill="#111111">(b) Shear force V<tspan font-size="9" dy="3">Ed</tspan><tspan dy="-3"> (kN)</tspan></text>
  <polygon points="80,250 80,207 320,250" fill="#4393c3" fill-opacity="0.35" stroke="none"/>
  <polygon points="320,250 560,293 560,250" fill="#d6604d" fill-opacity="0.35" stroke="none"/>
  <polyline points="80,250 80,207 560,293 560,250" fill="none" stroke="#222222" stroke-width="1.4"/>
  <line x1="70" y1="250" x2="575" y2="250" stroke="#222222" stroke-width="1"/>
  <text x="88" y="205" font-size="11">+107.8</text>
  <text x="552" y="306" text-anchor="end" font-size="11">−107.8</text>
  <text x="326" y="244" font-size="10.5" fill="#555555">V = 0 at midspan</text>

  <!-- ================= Bending moment diagram ================= -->
  <text x="20" y="325" font-weight="bold" fill="#111111">(c) Bending moment M<tspan font-size="9" dy="3">Ed</tspan><tspan dy="-3"> (kNm), drawn on tension side</tspan></text>
  <path d="M 80 340 Q 320 534 560 340 Z" fill="#74c476" fill-opacity="0.35" stroke="#222222" stroke-width="1.4"/>
  <line x1="70" y1="340" x2="575" y2="340" stroke="#222222" stroke-width="1"/>
  <line x1="320" y1="340" x2="320" y2="437" stroke="#555555" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="330" y="430" font-size="11">M<tspan font-size="8" dy="3">max</tspan><tspan dy="-3"> = w</tspan><tspan font-size="8" dy="3">Ed</tspan><tspan dy="-3">L² / 8 = 161.6 kNm</tspan></text>
  <text x="320" y="462" text-anchor="middle" font-size="10.5" fill="#555555">Parabolic distribution; sagging moment throughout</text>
</svg>
