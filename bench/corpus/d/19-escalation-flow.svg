<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="640" height="680" fill="#ffffff"/>

  <!-- Start -->
  <rect x="220" y="20" width="200" height="40" rx="20" ry="20" fill="#e8eef7" stroke="#2b4c7e" stroke-width="1.4"/>
  <text x="320" y="38" text-anchor="middle" font-weight="bold" fill="#1b2f4f">Alert fires</text>
  <text x="320" y="53" text-anchor="middle" font-size="10.5" fill="#1b2f4f">PagerDuty / Grafana alert</text>
  <line x1="320" y1="60" x2="320" y2="83" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Acknowledge -->
  <rect x="190" y="85" width="260" height="44" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="320" y="112" text-anchor="middle">Primary on-call acknowledges</text>
  <line x1="320" y1="129" x2="320" y2="148" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Decision: acked? -->
  <polygon points="320,150 430,190 320,230 210,190" fill="#fff7e0" stroke="#a87b00" stroke-width="1.3"/>
  <text x="320" y="187" text-anchor="middle">Acknowledged</text>
  <text x="320" y="202" text-anchor="middle">within 5 min?</text>
  <line x1="320" y1="230" x2="320" y2="253" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="328" y="246" font-size="11" fill="#555555">Yes</text>
  <line x1="430" y1="190" x2="468" y2="190" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="436" y="183" font-size="11" fill="#555555">No</text>

  <!-- Auto-escalate -->
  <rect x="470" y="160" width="150" height="60" rx="4" fill="#fdecea" stroke="#a83232" stroke-width="1.3"/>
  <text x="545" y="181" text-anchor="middle" font-size="11.5">Auto-escalate to</text>
  <text x="545" y="196" text-anchor="middle" font-size="11.5">secondary on-call;</text>
  <text x="545" y="211" text-anchor="middle" font-size="11.5">EM paged at 15 min</text>
  <polyline points="545,160 545,107 452,107" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Assess -->
  <rect x="190" y="255" width="260" height="44" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="320" y="275" text-anchor="middle">Assess customer impact,</text>
  <text x="320" y="291" text-anchor="middle">assign severity (Table 1)</text>
  <line x1="320" y1="299" x2="320" y2="318" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Decision: severity -->
  <polygon points="320,320 430,360 320,400 210,360" fill="#fff7e0" stroke="#a87b00" stroke-width="1.3"/>
  <text x="320" y="365" text-anchor="middle">SEV1 or SEV2?</text>
  <polyline points="210,360 155,360 155,408" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="176" y="352" font-size="11" fill="#555555">Yes</text>
  <polyline points="430,360 520,360 520,408" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="456" y="352" font-size="11" fill="#555555">No</text>

  <!-- Major incident path -->
  <rect x="30" y="410" width="250" height="78" rx="4" fill="#fdecea" stroke="#a83232" stroke-width="1.3"/>
  <text x="155" y="432" text-anchor="middle" font-weight="bold">Declare incident</text>
  <text x="155" y="449" text-anchor="middle" font-size="11.5">Open #inc-payments-&lt;date&gt; channel</text>
  <text x="155" y="465" text-anchor="middle" font-size="11.5">Page Incident Commander + Comms</text>
  <text x="155" y="481" text-anchor="middle" font-size="11.5">Status page within 15 min</text>
  <line x1="155" y1="488" x2="155" y2="518" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Minor incident path -->
  <rect x="420" y="410" width="200" height="78" rx="4" fill="#eef6ec" stroke="#3d7a35" stroke-width="1.3"/>
  <text x="520" y="432" text-anchor="middle" font-weight="bold">SEV3 / SEV4</text>
  <text x="520" y="449" text-anchor="middle" font-size="11.5">Fix in business hours</text>
  <text x="520" y="465" text-anchor="middle" font-size="11.5">Ticket in PAY queue</text>
  <text x="520" y="481" text-anchor="middle" font-size="11.5">Post in #payments-eng</text>

  <!-- Mitigate -->
  <rect x="30" y="520" width="250" height="44" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="155" y="540" text-anchor="middle">Mitigate first: roll back, fail over,</text>
  <text x="155" y="556" text-anchor="middle">scale out (Section 5)</text>
  <polyline points="155,564 155,582 320,582 320,598" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <polyline points="520,488 520,630 452,630" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Resolve -->
  <rect x="190" y="600" width="260" height="60" rx="30" ry="30" fill="#e8eef7" stroke="#2b4c7e" stroke-width="1.4"/>
  <text x="320" y="623" text-anchor="middle" font-weight="bold" fill="#1b2f4f">Resolve and close</text>
  <text x="320" y="639" text-anchor="middle" font-size="11" fill="#1b2f4f">Monitor 30 min, then close;</text>
  <text x="320" y="653" text-anchor="middle" font-size="11" fill="#1b2f4f">PIR within 5 business days</text>
</svg>
