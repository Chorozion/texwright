<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="600" height="270" fill="#ffffff"/>

  <!-- vertical grid -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="160" y1="40" x2="160" y2="215"/>
    <line x1="360" y1="40" x2="360" y2="215"/>
    <line x1="460" y1="40" x2="460" y2="215"/>
    <line x1="560" y1="40" x2="560" y2="215"/>
  </g>
  <!-- zero line -->
  <line x1="260" y1="40" x2="260" y2="215" stroke="#555555" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- row labels -->
  <g text-anchor="end">
    <text x="145" y="74">Mobile</text>
    <text x="145" y="124">Desktop</text>
    <text x="145" y="184" font-weight="bold">All visitors</text>
  </g>
  <line x1="20" y1="152" x2="560" y2="152" stroke="#cccccc" stroke-width="1"/>

  <!-- Mobile: 0.68 [0.25, 1.11] -->
  <line x1="310" y1="70" x2="482" y2="70" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="310" y1="64" x2="310" y2="76" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="482" y1="64" x2="482" y2="76" stroke="#2c6fbb" stroke-width="2"/>
  <rect x="391" y="65" width="10" height="10" fill="#2c6fbb"/>

  <!-- Desktop: 0.47 [-0.18, 1.11] -->
  <line x1="224" y1="120" x2="482" y2="120" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="224" y1="114" x2="224" y2="126" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="482" y1="114" x2="482" y2="126" stroke="#2c6fbb" stroke-width="2"/>
  <rect x="349" y="115" width="10" height="10" fill="#2c6fbb"/>

  <!-- All: 0.60 [0.23, 0.96] -->
  <line x1="306" y1="180" x2="452" y2="180" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="306" y1="173" x2="306" y2="187" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="452" y1="173" x2="452" y2="187" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="380,171 389,180 380,189 371,180" fill="#1a1a1a"/>

  <!-- x axis -->
  <line x1="160" y1="215" x2="560" y2="215" stroke="#000000" stroke-width="1.2"/>
  <g stroke="#000000">
    <line x1="160" y1="215" x2="160" y2="220"/>
    <line x1="260" y1="215" x2="260" y2="220"/>
    <line x1="360" y1="215" x2="360" y2="220"/>
    <line x1="460" y1="215" x2="460" y2="220"/>
    <line x1="560" y1="215" x2="560" y2="220"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="160" y="235">−0.5</text>
    <text x="260" y="235">0</text>
    <text x="360" y="235">+0.5</text>
    <text x="460" y="235">+1.0</text>
    <text x="560" y="235">+1.5</text>
  </g>
  <text x="360" y="258" text-anchor="middle">Difference in conversion rate, B − A (percentage points)</text>

  <text x="270" y="30" font-size="11" fill="#555555">favors B →</text>
  <text x="250" y="30" font-size="11" fill="#555555" text-anchor="end">← favors A</text>
</svg>
