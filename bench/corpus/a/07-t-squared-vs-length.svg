<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Times New Roman, Times, serif" font-size="14">
  <rect width="560" height="420" fill="#ffffff"/>

  <!-- frame -->
  <rect x="80" y="40" width="440" height="320" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- x ticks: L = 0, 0.2, ..., 1.0 m -->
  <g stroke="#000000" stroke-width="1">
    <line x1="80" y1="360" x2="80" y2="354"/>
    <line x1="160" y1="360" x2="160" y2="354"/>
    <line x1="240" y1="360" x2="240" y2="354"/>
    <line x1="320" y1="360" x2="320" y2="354"/>
    <line x1="400" y1="360" x2="400" y2="354"/>
    <line x1="480" y1="360" x2="480" y2="354"/>
    <!-- y ticks: T^2 = 0, 1, 2, 3, 4 s^2 -->
    <line x1="80" y1="360" x2="86" y2="360"/>
    <line x1="80" y1="288.9" x2="86" y2="288.9"/>
    <line x1="80" y1="217.8" x2="86" y2="217.8"/>
    <line x1="80" y1="146.7" x2="86" y2="146.7"/>
    <line x1="80" y1="75.6" x2="86" y2="75.6"/>
  </g>
  <g text-anchor="middle">
    <text x="80" y="380">0.0</text>
    <text x="160" y="380">0.2</text>
    <text x="240" y="380">0.4</text>
    <text x="320" y="380">0.6</text>
    <text x="400" y="380">0.8</text>
    <text x="480" y="380">1.0</text>
  </g>
  <g text-anchor="end">
    <text x="72" y="365">0</text>
    <text x="72" y="294">1</text>
    <text x="72" y="223">2</text>
    <text x="72" y="152">3</text>
    <text x="72" y="81">4</text>
  </g>

  <text x="300" y="408" text-anchor="middle" font-size="15"><tspan font-style="italic">L</tspan> (m)</text>
  <text x="30" y="200" text-anchor="middle" font-size="15" transform="rotate(-90 30 200)"><tspan font-style="italic">T</tspan><tspan dy="-6" font-size="11">2</tspan><tspan dy="6"> (s</tspan><tspan dy="-6" font-size="11">2</tspan><tspan dy="6">)</tspan></text>

  <!-- least-squares line: T^2 = 4.0297 L + 0.0018 -->
  <line x1="80" y1="359.9" x2="520" y2="44.7" stroke="#1f4e9c" stroke-width="1.6"/>

  <!-- data points -->
  <g fill="#ffffff" stroke="#b22222" stroke-width="1.6">
    <circle cx="180" cy="288.1" r="4.5"/>
    <circle cx="240" cy="245.6" r="4.5"/>
    <circle cx="300" cy="202.0" r="4.5"/>
    <circle cx="360" cy="159.5" r="4.5"/>
    <circle cx="420" cy="115.8" r="4.5"/>
    <circle cx="480" cy="73.6" r="4.5"/>
  </g>

  <!-- legend -->
  <rect x="96" y="54" width="226" height="54" fill="#ffffff" stroke="#999999"/>
  <circle cx="112" cy="72" r="4.5" fill="#ffffff" stroke="#b22222" stroke-width="1.6"/>
  <text x="126" y="77">measured (mean of 5 trials)</text>
  <line x1="102" y1="94" x2="122" y2="94" stroke="#1f4e9c" stroke-width="1.6"/>
  <text x="126" y="99">fit: <tspan font-style="italic">T</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> = 4.030 </tspan><tspan font-style="italic">L</tspan> + 0.002</text>
</svg>
