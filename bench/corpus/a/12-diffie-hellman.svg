<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- column backgrounds -->
  <rect x="20" y="20" width="180" height="360" rx="8" fill="#eef4fb" stroke="#9db8d9"/>
  <rect x="230" y="20" width="180" height="360" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="5,4"/>
  <rect x="440" y="20" width="180" height="360" rx="8" fill="#fbf1ea" stroke="#dcb18f"/>

  <!-- headers -->
  <g font-weight="bold" text-anchor="middle" font-size="16">
    <text x="110" y="48">Alice</text>
    <text x="320" y="48">Public channel</text>
    <text x="530" y="48">Bob</text>
  </g>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#666666">(Eve sees all of this)</text>

  <!-- shared parameters -->
  <text x="320" y="100" text-anchor="middle">p = 23,  g = 5</text>

  <!-- secrets -->
  <text x="110" y="140" text-anchor="middle">secret a = 6</text>
  <text x="530" y="140" text-anchor="middle">secret b = 15</text>

  <!-- public values computed -->
  <text x="110" y="190" text-anchor="middle">A = 5<tspan dy="-6" font-size="10">6</tspan><tspan dy="6"> mod 23 = 8</tspan></text>
  <text x="530" y="240" text-anchor="middle">B = 5<tspan dy="-6" font-size="10">15</tspan><tspan dy="6"> mod 23 = 19</tspan></text>

  <!-- A travels right -->
  <line x1="190" y1="200" x2="450" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="194" text-anchor="middle" font-weight="bold">A = 8</text>

  <!-- B travels left -->
  <line x1="450" y1="250" x2="190" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="244" text-anchor="middle" font-weight="bold">B = 19</text>

  <!-- shared secret -->
  <text x="110" y="310" text-anchor="middle">B<tspan dy="-6" font-size="10">a</tspan><tspan dy="6"> = 19</tspan><tspan dy="-6" font-size="10">6</tspan><tspan dy="6"> mod 23</tspan></text>
  <text x="530" y="310" text-anchor="middle">A<tspan dy="-6" font-size="10">b</tspan><tspan dy="6"> = 8</tspan><tspan dy="-6" font-size="10">15</tspan><tspan dy="6"> mod 23</tspan></text>
  <rect x="70" y="326" width="80" height="32" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="110" y="347" text-anchor="middle" font-weight="bold" fill="#2e7d32">= 2</text>
  <rect x="490" y="326" width="80" height="32" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="530" y="347" text-anchor="middle" font-weight="bold" fill="#2e7d32">= 2</text>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#666666">Eve knows p, g, A, B</text>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#666666">but not a, b, or the secret</text>
</svg>
