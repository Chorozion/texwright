<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" viewBox="0 0 540 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="540" height="420" fill="#ffffff"/>

  <!-- grid -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="70" y1="80" x2="470" y2="80"/>
    <line x1="70" y1="120" x2="470" y2="120"/>
    <line x1="70" y1="160" x2="470" y2="160"/>
    <line x1="70" y1="200" x2="470" y2="200"/>
    <line x1="70" y1="240" x2="470" y2="240"/>
    <line x1="70" y1="280" x2="470" y2="280"/>
    <line x1="70" y1="320" x2="470" y2="320"/>
    <line x1="170" y1="40" x2="170" y2="360"/>
    <line x1="270" y1="40" x2="270" y2="360"/>
    <line x1="370" y1="40" x2="370" y2="360"/>
    <line x1="470" y1="40" x2="470" y2="360"/>
  </g>

  <!-- axes -->
  <g stroke="#000000" stroke-width="1.2">
    <line x1="70" y1="360" x2="470" y2="360"/>
    <line x1="70" y1="40" x2="70" y2="360"/>
    <line x1="70" y1="360" x2="70" y2="365"/>
    <line x1="170" y1="360" x2="170" y2="365"/>
    <line x1="270" y1="360" x2="270" y2="365"/>
    <line x1="370" y1="360" x2="370" y2="365"/>
    <line x1="470" y1="360" x2="470" y2="365"/>
    <line x1="65" y1="40" x2="70" y2="40"/>
    <line x1="65" y1="120" x2="70" y2="120"/>
    <line x1="65" y1="200" x2="70" y2="200"/>
    <line x1="65" y1="280" x2="70" y2="280"/>
    <line x1="65" y1="360" x2="70" y2="360"/>
  </g>

  <!-- x tick labels -->
  <g text-anchor="middle">
    <text x="70" y="380">0</text>
    <text x="170" y="380">100</text>
    <text x="270" y="380">200</text>
    <text x="370" y="380">300</text>
    <text x="470" y="380">400</text>
  </g>

  <!-- y tick labels -->
  <g text-anchor="end">
    <text x="60" y="44">10<tspan dy="-6" font-size="9">0</tspan></text>
    <text x="60" y="124">10<tspan dy="-6" font-size="9">−2</tspan></text>
    <text x="60" y="204">10<tspan dy="-6" font-size="9">−4</tspan></text>
    <text x="60" y="284">10<tspan dy="-6" font-size="9">−6</tspan></text>
    <text x="60" y="364">10<tspan dy="-6" font-size="9">−8</tspan></text>
  </g>

  <!-- axis titles -->
  <text x="270" y="405" text-anchor="middle" font-size="13">Iteration k</text>
  <text x="18" y="200" text-anchor="middle" font-size="13" transform="rotate(-90 18 200)">(f(x<tspan dy="3" font-size="9">k</tspan><tspan dy="-3">) − f*) / (f(x</tspan><tspan dy="3" font-size="9">0</tspan><tspan dy="-3">) − f*)</tspan></text>

  <!-- kappa = 10 -->
  <polyline fill="none" stroke="#1f77b4" stroke-width="2" points="70,40 157,358"/>

  <!-- kappa = 100 -->
  <polyline fill="none" stroke="#ff7f0e" stroke-width="2" points="70,40 470,179.7"/>

  <!-- rank deficient (mu = 0) -->
  <polyline fill="none" stroke="#2ca02c" stroke-width="2"
            points="70,40 71,45 72,48.9 75,57 80,65.5 95,78.8 120,89.9 170,101.4 270,113.2 370,120.2 470,125.1"/>

  <!-- Theorem 1 bound L R^2 / (2k) -->
  <polyline fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="6,4"
            points="80,40 95,55.9 120,68 170,80 270,92 370,99.1 470,104.1"/>

  <!-- legend -->
  <g font-size="12">
    <rect x="285" y="262" width="178" height="86" fill="#ffffff" stroke="#bbbbbb"/>
    <line x1="295" y1="280" x2="325" y2="280" stroke="#1f77b4" stroke-width="2"/>
    <text x="332" y="284">κ = 10</text>
    <line x1="295" y1="299" x2="325" y2="299" stroke="#ff7f0e" stroke-width="2"/>
    <text x="332" y="303">κ = 100</text>
    <line x1="295" y1="318" x2="325" y2="318" stroke="#2ca02c" stroke-width="2"/>
    <text x="332" y="322">rank deficient (μ = 0)</text>
    <line x1="295" y1="337" x2="325" y2="337" stroke="#555555" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="332" y="341">bound LR²/(2k)</text>
  </g>
</svg>
