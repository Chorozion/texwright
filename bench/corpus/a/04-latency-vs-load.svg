<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="620" height="400" fill="#ffffff"/>

  <!-- grid: decades and half-decades on y, 500 RPS steps on x -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="80" y1="40" x2="560" y2="40"/>
    <line x1="80" y1="140" x2="560" y2="140"/>
    <line x1="80" y1="240" x2="560" y2="240"/>
    <line x1="176" y1="40" x2="176" y2="340"/>
    <line x1="272" y1="40" x2="272" y2="340"/>
    <line x1="368" y1="40" x2="368" y2="340"/>
    <line x1="464" y1="40" x2="464" y2="340"/>
    <line x1="560" y1="40" x2="560" y2="340"/>
  </g>
  <g stroke="#f3f3f3" stroke-width="1">
    <line x1="80" y1="70" x2="560" y2="70"/>
    <line x1="80" y1="170" x2="560" y2="170"/>
    <line x1="80" y1="270" x2="560" y2="270"/>
  </g>

  <!-- axes -->
  <g stroke="#000000" stroke-width="1.2">
    <line x1="80" y1="340" x2="560" y2="340"/>
    <line x1="80" y1="40" x2="80" y2="340"/>
  </g>

  <!-- x ticks -->
  <g text-anchor="middle">
    <text x="80" y="358">0</text>
    <text x="176" y="358">500</text>
    <text x="272" y="358">1,000</text>
    <text x="368" y="358">1,500</text>
    <text x="464" y="358">2,000</text>
    <text x="560" y="358">2,500</text>
  </g>
  <!-- y ticks (log scale) -->
  <g text-anchor="end">
    <text x="72" y="44">10,000</text>
    <text x="72" y="144">1,000</text>
    <text x="72" y="244">100</text>
    <text x="72" y="344">10</text>
  </g>

  <text x="320" y="384" text-anchor="middle" font-size="13">Offered load (requests per second)</text>
  <text x="22" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 22 190)">Latency (ms, log scale)</text>

  <!-- SLO line: p95 250 ms -->
  <line x1="80" y1="200.2" x2="560" y2="200.2" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="7,4"/>
  <text x="86" y="194" fill="#c0392b" font-size="11">p95 objective (250 ms)</text>

  <!-- p50 -->
  <polyline fill="none" stroke="#2c7fb8" stroke-width="2"
            points="128,314.5 176,312.1 272,305.8 368,290.9 416,271.9 464,224.8 512,180.3 560,154.3"/>
  <!-- p95 -->
  <polyline fill="none" stroke="#f28e2b" stroke-width="2"
            points="128,278.7 176,275.7 272,263.7 368,241.3 416,212.6 464,161.5 512,123 560,93.8"/>
  <!-- p99 -->
  <polyline fill="none" stroke="#7b3294" stroke-width="2"
            points="128,260.8 176,254.9 272,241.8 368,217.5 416,186.9 464,130.7 512,93 560,70.1"/>

  <!-- markers -->
  <g fill="#2c7fb8">
    <circle cx="128" cy="314.5" r="3"/><circle cx="176" cy="312.1" r="3"/><circle cx="272" cy="305.8" r="3"/>
    <circle cx="368" cy="290.9" r="3"/><circle cx="416" cy="271.9" r="3"/><circle cx="464" cy="224.8" r="3"/>
    <circle cx="512" cy="180.3" r="3"/><circle cx="560" cy="154.3" r="3"/>
  </g>
  <g fill="#f28e2b">
    <circle cx="128" cy="278.7" r="3"/><circle cx="176" cy="275.7" r="3"/><circle cx="272" cy="263.7" r="3"/>
    <circle cx="368" cy="241.3" r="3"/><circle cx="416" cy="212.6" r="3"/><circle cx="464" cy="161.5" r="3"/>
    <circle cx="512" cy="123" r="3"/><circle cx="560" cy="93.8" r="3"/>
  </g>
  <g fill="#7b3294">
    <circle cx="128" cy="260.8" r="3"/><circle cx="176" cy="254.9" r="3"/><circle cx="272" cy="241.8" r="3"/>
    <circle cx="368" cy="217.5" r="3"/><circle cx="416" cy="186.9" r="3"/><circle cx="464" cy="130.7" r="3"/>
    <circle cx="512" cy="93" r="3"/><circle cx="560" cy="70.1" r="3" fill="none" stroke="#7b3294" stroke-width="1.5"/>
  </g>

  <!-- legend -->
  <rect x="96" y="54" width="118" height="70" fill="#ffffff" stroke="#bbbbbb"/>
  <line x1="106" y1="72" x2="132" y2="72" stroke="#7b3294" stroke-width="2"/>
  <text x="140" y="76">p99</text>
  <line x1="106" y1="92" x2="132" y2="92" stroke="#f28e2b" stroke-width="2"/>
  <text x="140" y="96">p95</text>
  <line x1="106" y1="112" x2="132" y2="112" stroke="#2c7fb8" stroke-width="2"/>
  <text x="140" y="116">p50</text>

  <text x="556" y="62" text-anchor="end" font-size="10" fill="#555555">open marker: client timeout (5 s)</text>
</svg>
